server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
    }

    # location /api/ {
    #     proxy_pass http://backend:8000;
    #     proxy_buffering off;
    # }

    location /api/ {
        proxy_pass https://qb-ladder-backend-684065337007.northamerica-northeast1.run.app;
        proxy_buffering off;
    }
}